project:
  name: restaurant-voice-ordering-agent
  package: restaurant_agent
  spec: docs/SPEC.md
  stories: docs/STORIES.md
  manifest: grading/manifest.yaml

stories:
  - id: US-01
    title: Start a Browser Voice Call and Receive Greeting
    spec_sections:
      - Purpose
      - Voice Interfaces
      - Public Interfaces
      - Conversation Flow, Order State, and Dialogue State
      - Logging and Operability Requirements
    api_routes:
      - GET /
      - GET /ui
      - POST /api/browser/start-call
      - POST /api/sessions
    mcp_tools: []
    source_modules:
      - src/restaurant_agent/api.py
      - src/restaurant_agent/web.py
      - src/restaurant_agent/agent.py
      - src/restaurant_agent/session_store.py
      - src/restaurant_agent/order_store.py
      - src/restaurant_agent/schemas.py
    tests:
      - tests/user_stories/test_us_01_start_voice_call.py
      - tests/integration/test_sessions_api.py
    manual_screenshot: docs/assets/stories/us_01_expected.png
    usage_section: docs/usage.md#us-01-start-a-browser-voice-call-and-receive-greeting

  - id: US-02
    title: Ask a Menu Question Using RAG
    spec_sections:
      - Menu Ingestion Strategy
      - RAG Strategy
      - MCP Tool Design
      - Public Interfaces
    api_routes:
      - POST /api/turn
      - POST /api/menu/search
